{% extends "base.html" %}
{% block title %}Attendance{% endblock %}
{% block content %}
<h2 class="mb-3">Mark Attendance — {{ today }}</h2>

<form method="POST">
    <table class="table table-striped bg-white shadow-sm">
        <thead>
            <tr>
                <th>Name</th>
                <th>Department</th>
                <th>Present</th>
                <th>Absent</th>
            </tr>
        </thead>
        <tbody>
            {% for e in employees %}
            <tr>
                <td>{{ e.name }}</td>
                <td>{{ e.department }}</td>
                <td>
                    <input type="radio" name="status_{{ e.id }}" value="present"
                        {% if marked_today.get(e.id) == 'present' or e.id not in marked_today %}checked{% endif %}>
                </td>
                <td>
                    <input type="radio" name="status_{{ e.id }}" value="absent"
                        {% if marked_today.get(e.id) == 'absent' %}checked{% endif %}>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="4" class="text-center text-muted">No employees to mark.</td></tr>
            {% endfor %}
        </tbody>
    </table>
    <button type="submit" class="btn btn-primary">Save Attendance</button>
</form>
{% endblock %}
