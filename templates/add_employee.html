{% extends "base.html" %}
{% block title %}Add Employee{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="mb-4">Add Employee</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Temporary Password</label>
                        <input type="text" name="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" name="department" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select" id="roleSelect" onchange="toggleTeamSize()" required>
                            <option value="employee">Employee</option>
                            <option value="manager">Manager</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Base Salary (₹/month)</label>
                        <input type="number" step="0.01" name="base_salary" class="form-control" required>
                    </div>
                    <div class="mb-3" id="teamSizeField" style="display:none;">
                        <label class="form-label">Team Size (managers only)</label>
                        <input type="number" name="team_size" class="form-control" value="0">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Add Employee</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function toggleTeamSize() {
    const role = document.getElementById('roleSelect').value;
    document.getElementById('teamSizeField').style.display = role === 'manager' ? 'block' : 'none';
}
</script>
{% endblock %}
